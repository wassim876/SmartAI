name: smartai
description: SmartAI Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  #UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6
  fl_chart: ^0.69.2

#State Management & Utilities
  provider: ^6.1.1
  intl: ^0.20.2
  flutter_slidable: ^3.1.0
  dio: ^5.9.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.0

#Voice (on-device speech-to-text + text-to-speech)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

#Supabase (backend: auth, database, storage, realtime)
  supabase_flutter: ^2.8.0

#Firebase — retained ONLY for push notifications (FCM)
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/android-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/